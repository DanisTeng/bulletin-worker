<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowDeep" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1400" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="60" fill="url(#headerGrad)" rx="8"/>
  <rect x="0" y="40" width="900" height="20" fill="url(#headerGrad)"/>
  <text x="450" y="40" text-anchor="middle" fill="white" font-size="22" font-weight="700">Bulletin Worker — 架构与工作流</text>

  <!-- ============ LEFT COLUMN: File Structure ============ -->
  <rect x="30" y="80" width="380" height="350" fill="white" stroke="#d1d5db" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <rect x="30" y="80" width="380" height="34" fill="#e2e8f0" rx="8"/>
  <rect x="30" y="100" width="380" height="14" fill="#e2e8f0"/>
  <text x="220" y="103" text-anchor="middle" fill="#475569" font-size="14" font-weight="600">📁 文件结构</text>

  <text x="48" y="140" fill="#2563eb" font-size="13" font-weight="600">bulletin-worker/</text>
  <text x="63" y="162" fill="#64748b" font-size="12">├── config.json             ← 配置</text>
  <text x="63" y="182" fill="#64748b" font-size="12">├── DESIGN-v2.md            ← 设计文档</text>
  <text x="63" y="202" fill="#64748b" font-size="12">├── prompt.txt              ← skill prompt</text>
  <text x="63" y="222" fill="#64748b" font-size="12">├── worker.py               ← Python 编排器（建议方案）</text>
  <text x="63" y="244" fill="#64748b" font-size="12">├── scripts/</text>
  <text x="78" y="264" fill="#64748b" font-size="12">├── bb.py            ← 留言板 API 核心库</text>
  <text x="78" y="284" fill="#64748b" font-size="12">├── bb-post / bb-recent     ← shell wrapper</text>
  <text x="78" y="304" fill="#64748b" font-size="12">├── bb-status               ← 状态读写</text>
  <text x="78" y="324" fill="#64748b" font-size="12">├── bb-wake                 ← 唤醒快捷</text>
  <text x="78" y="344" fill="#64748b" font-size="12">└── build_prompt.py         ← 动态 prompt</text>
  <text x="48" y="370" fill="#64748b" font-size="12">├── tmp/                    ← 运行时数据（git ignored）</text>
  <text x="63" y="390" fill="#64748b" font-size="12">├── status.json      ← ACTIVE/IDLE/BUSY</text>
  <text x="63" y="410" fill="#64748b" font-size="12">└── 2026-06-02.md   ← 留言记录</text>

  <!-- ============ RIGHT COLUMN: State Machine ============ -->
  <rect x="450" y="80" width="420" height="350" fill="white" stroke="#d1d5db" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <rect x="450" y="80" width="420" height="34" fill="#e2e8f0" rx="8"/>
  <rect x="450" y="100" width="420" height="14" fill="#e2e8f0"/>
  <text x="660" y="103" text-anchor="middle" fill="#475569" font-size="14" font-weight="600">🔄 状态机（3 态）</text>

  <!-- IDLE -->
  <rect x="590" y="135" width="140" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="165" text-anchor="middle" fill="#475569" font-size="16" font-weight="700">IDLE 💤</text>

  <!-- ACTIVE -->
  <rect x="590" y="235" width="140" height="50" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="265" text-anchor="middle" fill="#1e40af" font-size="16" font-weight="700">ACTIVE ⏳</text>

  <!-- BUSY -->
  <rect x="590" y="335" width="140" height="50" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="365" text-anchor="middle" fill="#15803d" font-size="16" font-weight="700">BUSY 🏃</text>

  <!-- Arrows -->
  <!-- IDLE → ACTIVE -->
  <line x1="660" y1="185" x2="660" y2="232" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="6,3"/>
  <text x="672" y="212" fill="#2563eb" font-size="10" font-style="italic">bb-wake</text>

  <!-- ACTIVE → BUSY -->
  <line x1="660" y1="285" x2="660" y2="332" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="672" y="312" fill="#16a34a" font-size="10" font-style="italic">cron 第 0 步</text>

  <!-- BUSY → IDLE (无事) -->
  <path d="M470,280 C470,220 520,175 587,170" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="475" y="250" fill="#94a3b8" font-size="10">无事/阻塞</text>

  <!-- BUSY → IDLE (方向不明/超时) -->
  <path d="M470,340 C470,380 520,390 587,360" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <text x="475" y="390" fill="#dc2626" font-size="10">方向不明 / 7轮超时</text>

  <!-- BUSY → ACTIVE (继续工作) -->
  <path d="M470,300 C470,270 520,260 587,255" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)" stroke-dasharray="5,3"/>
  <text x="475" y="275" fill="#2563eb" font-size="10">还有子步骤</text>

  <!-- ============ BOTTOM FULL WIDTH: Cron Flow ============ -->
  <rect x="30" y="460" width="840" height="920" fill="white" stroke="#d1d5db" stroke-width="1.5" rx="10" filter="url(#shadowDeep)"/>
  <rect x="30" y="460" width="840" height="34" fill="#e2e8f0" rx="10"/>
  <rect x="30" y="480" width="840" height="14" fill="#e2e8f0"/>
  <text x="450" y="483" text-anchor="middle" fill="#475569" font-size="14" font-weight="600">📋 Cron 内流程 — 每次醒来按序执行</text>

  <!-- Step 0 -->
  <rect x="60" y="510" width="780" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="510" width="30" height="75" rx="8" fill="#94a3b8"/>
  <rect x="80" y="510" width="10" height="75" fill="#94a3b8"/>
  <text x="66" y="555" text-anchor="middle" fill="white" font-size="14" font-weight="700">0</text>
  <text x="105" y="537" fill="#1e293b" font-size="14" font-weight="700">IDLE 检查</text>
  <text x="105" y="557" fill="#475569" font-size="12">读 status.json — IDLE → 直接退出，ACTIVE/BUSY → 设 BUSY 后继续</text>
  <text x="105" y="574" fill="#64748b" font-size="11">⚡ 零 token 退出，适合频繁 cron</text>

  <!-- Arrow 0→1 -->
  <line x1="450" y1="585" x2="450" y2="602" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <rect x="60" y="605" width="780" height="75" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="60" y="605" width="30" height="75" rx="8" fill="#22c55e"/>
  <rect x="80" y="605" width="10" height="75" fill="#22c55e"/>
  <text x="66" y="650" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text>
  <text x="105" y="632" fill="#1e293b" font-size="14" font-weight="700">检查是否有未完成任务</text>
  <text x="105" y="652" fill="#475569" font-size="12">读留言板 + status.mission — 无任务 → 回话 → IDLE → 退出</text>
  <text x="105" y="669" fill="#64748b" font-size="11">🗣️ "回话" = 统一出口：包含汇报/回答问题/告知无事</text>

  <!-- Arrow 1→2 -->
  <line x1="450" y1="680" x2="450" y2="697" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="60" y="700" width="780" height="85" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="60" y="700" width="30" height="85" rx="8" fill="#ef4444"/>
  <rect x="80" y="700" width="10" height="85" fill="#ef4444"/>
  <text x="66" y="750" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text>
  <text x="105" y="727" fill="#1e293b" font-size="14" font-weight="700">方向明确性检查</text>
  <text x="105" y="747" fill="#475569" font-size="12">任务是否清晰、可执行？</text>
  <text x="105" y="764" fill="#dc2626" font-size="12" font-weight="600">方向不明确 → 留言困惑 → 回话 → IDLE → 退出</text>
  <text x="105" y="780" fill="#64748b" font-size="11">❓ 缺上下文/缺输入文件/描述模糊，都算方向不明确</text>

  <!-- Arrow 2→3 -->
  <line x1="450" y1="785" x2="450" y2="802" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="60" y="805" width="780" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="60" y="805" width="30" height="85" rx="8" fill="#3b82f6"/>
  <rect x="80" y="805" width="10" height="85" fill="#3b82f6"/>
  <text x="66" y="855" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text>
  <text x="105" y="832" fill="#1e293b" font-size="14" font-weight="700">任务拆分（仅在首次执行）</text>
  <text x="105" y="852" fill="#475569" font-size="12">将大任务拆为适配一次 cron 周期的子步骤，写入 status.json</text>
  <text x="105" y="869" fill="#64748b" font-size="11">📐 按 "上下文长度 + 时间预算" 估算每个子步骤的任务量</text>
  <text x="105" y="884" fill="#64748b" font-size="11">💬 在留言板上记录拆分结果供上级确认</text>

  <!-- Arrow 3→4 -->
  <line x1="450" y1="890" x2="450" y2="907" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="60" y="910" width="780" height="85" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="60" y="910" width="30" height="85" rx="8" fill="#a855f7"/>
  <rect x="80" y="910" width="10" height="85" fill="#a855f7"/>
  <text x="66" y="960" text-anchor="middle" fill="white" font-size="14" font-weight="700">4</text>
  <text x="105" y="937" fill="#1e293b" font-size="14" font-weight="700">执行子任务</text>
  <text x="105" y="957" fill="#475569" font-size="12">从 steps[current_step_index] 确定本轮任务，执行之</text>
  <text x="105" y="974" fill="#64748b" font-size="11">✅ 更新 progress / current_step_index / failed_attempts</text>
  <text x="105" y="989" fill="#64748b" font-size="11">💬 无论成败，在留言板记录结果</text>

  <!-- Arrow 4→5 -->
  <line x1="450" y1="995" x2="450" y2="1012" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="60" y="1015" width="780" height="85" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="60" y="1015" width="30" height="85" rx="8" fill="#dc2626"/>
  <rect x="80" y="1015" width="10" height="85" fill="#dc2626"/>
  <text x="66" y="1065" text-anchor="middle" fill="white" font-size="14" font-weight="700">5</text>
  <text x="105" y="1042" fill="#1e293b" font-size="14" font-weight="700">多轮失败检测</text>
  <text x="105" y="1062" fill="#475569" font-size="12">failed_attempts ≥ 7 次？</text>
  <text x="105" y="1079" fill="#dc2626" font-size="12" font-weight="600">是 → 留言报告阻塞 → 回话 → IDLE → 退出</text>
  <text x="105" y="1095" fill="#64748b" font-size="11">⏰ 上限来自 config.json max_consecutive_failures</text>

  <!-- Arrow 5→6 -->
  <line x1="450" y1="1100" x2="450" y2="1117" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="60" y="1120" width="780" height="100" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <rect x="60" y="1120" width="30" height="100" rx="8" fill="#eab308"/>
  <rect x="80" y="1120" width="10" height="100" fill="#eab308"/>
  <text x="66" y="1178" text-anchor="middle" fill="white" font-size="14" font-weight="700">6</text>
  <text x="105" y="1147" fill="#1e293b" font-size="14" font-weight="700">本轮退出 & 状态切换</text>
  <text x="105" y="1167" fill="#475569" font-size="12">还有子步骤？→ 回话 → 设 status = ACTIVE（下轮继续）</text>
  <text x="105" y="1187" fill="#475569" font-size="12">全部完成？→ 回话 → 设 status = IDLE</text>
  <text x="105" y="1207" fill="#64748b" font-size="11">🗣️ "回话" = 汇报本轮结果 + 下步计划 / 汇报完成</text>

  <!-- Footer -->
  <text x="450" y="1260" text-anchor="middle" fill="#64748b" font-size="11">Bulletin Worker v2 — 2026-06-02</text>
  <text x="450" y="1280" text-anchor="middle" fill="#94a3b8" font-size="10">🤖 James 设计 · 📋 Danis 审核</text>
</svg>
